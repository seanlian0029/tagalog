name: Publish Excel database

on:
  workflow_dispatch:
  push:
    paths:
      - DATABASE_SERVER.xlsx
      - scripts/sync-excel-data.mjs
      - package.json
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: publish-excel-database
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download website
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install converter
        run: npm ci
      - name: Validate Excel and create website JSON
        run: npm run sync:excel
      - name: Publish website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Website data is already current."
          else
            git commit -m "Publish Excel database"
            git push
          fi
